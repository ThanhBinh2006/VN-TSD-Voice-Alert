# Owner: Cả nhóm (Thành viên 1 giữ file này).
# Cấu hình BẤT BIẾN dùng chung cho cả hai mô hình để so sánh công bằng.
# Các file trong configs/pipelines/ KHÔNG được ghi đè: seed, data.*, train.batch_size, train.epochs, eval.batch_size, train.primary_metric.
seed: 42

data:
  root: null                    # thư mục processed dùng để train/eval; null = paths.processed_dir.
                                # Trên Kaggle: đặt đường dẫn dataset đã gắn (Add Input) qua notebook / --data-root.
  image_size: 640               # letterbox 640x640 cho cả hai mô hình
  pad_value: 0
  split: {train: 0.7, val: 0.2, test: 0.1}   # TODO: nhóm chốt tỉ lệ
  num_classes: null             # TODO: số lớp biển báo của dataset. Để null thì đếm từ configs/classes.csv.
                                # Faster R-CNN: box predictor = num_classes + 1 (thêm background).
  blur_threshold: 10.0          # Ngưỡng Laplacian variance xác định ảnh mờ (hạ từ 100 xuống 50 để tránh gán nhầm ảnh đường sá bình thường)
  dark_threshold: 85.0          # Ngưỡng Grayscale mean xác định ảnh tối

train:
  # TỔNG batch trên tất cả GPU. Faster R-CNN (DDP) phải chia bằng ts_alert.runtime.batch.per_rank_batch;
  # YOLO truyền nguyên tổng để Ultralytics tự chia GPU.
  batch_size: 32
  epochs: 100                    # Thống nhất số epoch mặc định cho cả hai mô hình (chỉnh theo thực nghiệm hoặc override)
  early_stopping_patience: 15   # early stopping (epoch)
  amp: true                     # mixed precision
  primary_metric: mAP50-95
  run_name: null                # tên run; null = lấy tên pipeline. Notebook tự sinh: {pipeline}_s{seed}_ep{epochs}_bs{batch}[_online]_{hash8}
  require_wandb: false          # true = bắt buộc log lên W&B (khi đó phải điền mục project bên dưới)

eval:
  batch_size: 32                # TỔNG trên mọi GPU, hai pipeline phải giống nhau
  split: test
  auto_eval_test: true          # true = fit() tự đánh giá tập Test sau khi huấn luyện xong
  metrics: [mAP50-95, mAP50, mAP75, AR100]
  benchmark: {warmup: 5, num_frames: 100}   # đo FPS

inference:
  conf_threshold: 0.50
  iou_threshold: 0.5
  frame_stride: 30               # Số frame bỏ qua giữa 2 lần gọi model (1 = đoán mọi frame, 30 = mỗi 30 frame đoán 1 lần)
  cpu:
    apply_on_load: false         # Giữ nguyên suy luận mặc định cho ML eval/benchmark; web realtime tự áp preset CPU
    preset: fast_cpu             # default | balanced | fast_cpu | realtime
    backend: pytorch             # auto | pytorch | onnx | openvino

realtime:
  default_mode: realtime         # realtime | buffered
  buffer_ahead_sec: 2.0
  step_fps_cap: 15.0
  video_playback_rate: 1.0       # Tốc độ phát video mặc định trên trình duyệt; phải > 0
  tts_timeout_sec: 3.0
  tts_cooldown_sec: 4.0
  tts_max_alert_age_sec: 2.5
  tts_max_queue_size: 6
  tts_playback_rate: 1.4         # Tốc độ phát giọng nói cảnh báo trên trình duyệt (1.0 - 2.0)
  tts_compact: true              # Rút gọn câu đọc realtime để giảm thời lượng đọc
  tts_compact_template: "{position_text}, {name}"
  tts_cutoff_on_pass: true       # Tự ngắt phát live khi biển báo đã đi qua (vẫn giữ file âm thanh)
  tts_cutoff_grace_sec: 0.25
  tts_cache_enabled: true        # Cache câu TTS trên đĩa để không gọi gTTS lặp lại

project:                        # Tuỳ chọn: theo dõi thí nghiệm bằng Weights & Biases
  wandb_base_url: null          # TODO: null = wandb.ai; điền nếu nhóm dùng server riêng
  wandb_entity: null            # TODO: tên team/tài khoản W&B
  wandb_project: TSD-Voice-Alert

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  classes_csv: configs/classes.csv
  outputs_dir: outputs
  uploads_dir: outputs/uploads
  db_path: outputs/traffic_sign.db       # TODO: Thành viên 5 có thể đổi nếu dùng DB khác

postprocess:                    # Owner: Thành viên 4
  position:                     # chia theo tâm ngang của bbox / chiều rộng khung hình
    left_max: 0.33
    right_min: 0.66
  dedup:
    iou_match: 0.3              # TODO: chỉnh theo thực nghiệm
    lost_frames: 15             # TODO: chỉnh theo thực nghiệm
  tts:
    engine: gtts                # gtts (cần internet) | pyttsx3 (offline)
    lang: vi
    cache_enabled: true
    template: "Chú ý, {position_text} có biển {name}"
    position_text: {left: "bên trái", front: "phía trước", right: "bên phải"}

app:                            # Owner: Thành viên 3 (thêm/bớt khoá tuỳ ý)
  host: 127.0.0.1
  port: 5000
  max_upload_mb: 200

sweep:                          # Tham số mặc định cho W&B Sweep (tools.run_sweep)
  method: bayes                 # bayes | random | grid
  metric:
    name: best/metric
    goal: maximize
  count: 5                     # Số lần thử mặc định mỗi lần chạy sweep
  early_terminate:
    type: hyperband
    min_iter: 5
