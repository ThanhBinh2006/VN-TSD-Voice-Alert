# Owner: Thành viên 2 — pipeline Faster R-CNN + preprocessing online.
# Online ops bên dưới chỉ chạy khi enabled: true.
# KHÔNG đặt train.batch_size / eval.batch_size ở đây. Cả hai lấy từ configs/shared.yaml.
pipeline: faster_rcnn
inherits: configs/shared.yaml

model:
  family: faster_rcnn
  backbone: resnet50            # torchvision fasterrcnn_resnet50_fpn (torchvision==0.24.1)
  pretrained: true              # COCO_V1
  weights: models/faster_rcnn/best.pth
  # Box predictor phải là data.num_classes + 1 (thêm background).
  # DataLoader phải dùng per_rank_batch để tổng batch không bị áp dụng lên MỖI GPU.

train:
  epochs: 20                    # TODO: chỉnh theo thực nghiệm
  lr: 0.005
  optimizer: SGD                # SGD, Adam, AdamW
  # Optimization hyperparameters
  momentum: 0.9                 # Momentum của optimizer (SGD momentum / Adam beta1)
  weight_decay: 0.0005          # Regularization (L2 weight decay)
  warmup_epochs: 3.0            # Số epoch warmup
  warmup_momentum: 0.8          # Momentum trong giai đoạn warmup
  warmup_bias_lr: 0.1           # Learning rate warmup cho bias

online_preprocess:
  enabled: false
  letterbox: true
  normalize: true
  hflip: false                  # Biển báo giao thông có tính định hướng, mặc định tắt lật ngang
  # Data augmentation hyperparameters (chỉ áp dụng khi enabled: true)
  mosaic: 1.0                   # Xác suất sử dụng Mosaic augmentation
  mixup: 0.15                   # Xác suất sử dụng MixUp
  scale: 0.5                    # Mức độ thay đổi tỷ lệ ảnh (+/- fraction)
  degrees: 0.0                  # Góc xoay ảnh (+/- deg)
  translate: 0.1                # Mức độ dịch chuyển ảnh (+/- fraction)
  hsv_h: 0.015                  # Biến đổi sắc độ Hue (0.0 - 1.0)
  hsv_s: 0.7                    # Biến đổi độ bão hòa Saturation (0.0 - 1.0)
  hsv_v: 0.4                    # Biến đổi độ sáng Brightness (0.0 - 1.0)
