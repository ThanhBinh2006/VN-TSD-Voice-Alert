# Owner: Thành viên 2 — pipeline Faster R-CNN + preprocessing online.
# Online ops bên dưới chỉ chạy khi enabled: true.
# KHÔNG đặt train.batch_size / train.epochs / eval.batch_size ở đây. Các khóa dùng chung lấy từ configs/shared.yaml.
pipeline: faster_rcnn
inherits: configs/shared.yaml

model:
  pretrained: true              # COCO_V1 (torchvision fasterrcnn_resnet50_fpn == 0.24.1)
  weights: models/faster_rcnn/best.pth
  # Box predictor phải là data.num_classes + 1 (thêm background).
  # DataLoader phải dùng per_rank_batch để tổng batch không bị áp dụng lên MỖI GPU.

train:
  lr: 0.005
  optimizer: SGD                # SGD, Adam, AdamW
  # Optimization hyperparameters
  momentum: 0.9                 # Momentum của optimizer (SGD momentum / Adam beta1)
  weight_decay: 0.0005          # Regularization (L2 weight decay)
  warmup_epochs: 3.0            # Số epoch warmup
  warmup_momentum: 0.8          # Momentum trong giai đoạn warmup
  warmup_bias_lr: 0.1           # Learning rate warmup cho bias

online_preprocess:
  enabled: false
  hflip: false                  # Biển báo giao thông có tính định hướng, mặc định tắt lật ngang
  # Data augmentation hyperparameters (chỉ áp dụng khi enabled: true; ColorJitter + che khuất một phần)
  hsv_h: 0.015                  # Biến đổi sắc độ Hue (0.0 - 0.5)
  hsv_s: 0.7                    # Biến đổi độ bão hòa Saturation
  hsv_v: 0.4                    # Biến đổi độ sáng Brightness
  occlusion_p: 0.30             # Xác suất áp dụng che khuất một phần góc/cạnh trên mỗi ảnh khi train (0.0 = tắt)
  occlusion_ratio: 0.30         # Tỉ lệ độ bị che phủ theo góc/cạnh của từng box (0.05 - 0.90)

sweep:                          # Không gian tìm kiếm siêu tham số (tuân thủ không ghi đè shared.yaml)
  parameters:
    train.lr:
      distribution: log_uniform_values
      min: 0.0001
      max: 0.02
    train.optimizer:
      values: [SGD, AdamW]
